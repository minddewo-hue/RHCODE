# Place the map, log_format, and zones in the nginx http {} block.
map $http_upgrade $rhzy_connection_upgrade {
  default upgrade;
  '' '';
}

log_format rhzy_transfer '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=rhzy_control_rate:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=rhzy_register_rate:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=rhzy_update_rate:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=rhzy_connections:10m;

server {
  listen 8000 default_server;
  listen [::]:8000 default_server;
  server_name 218.201.210.211;

  access_log /var/log/nginx/rhzy-transfer.access.log rhzy_transfer;
  error_log /var/log/nginx/rhzy-transfer.error.log warn;
  server_tokens off;
  client_max_body_size 35m;
  client_body_timeout 15s;
  send_timeout 70s;
  keepalive_timeout 10s;
  limit_conn rhzy_connections 20;

  location = /v1/relay/desktop {
    limit_req zone=rhzy_register_rate burst=5 nodelay;
    proxy_pass http://127.0.0.1:8001;
    include /etc/nginx/snippets/rhzy-transfer-proxy.conf;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }

  location = /control/v1/events {
    limit_req zone=rhzy_register_rate burst=10 nodelay;
    proxy_pass http://127.0.0.1:8001;
    include /etc/nginx/snippets/rhzy-transfer-proxy.conf;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }

  location /control/ {
    limit_req zone=rhzy_control_rate burst=30 nodelay;
    proxy_pass http://127.0.0.1:8001;
    include /etc/nginx/snippets/rhzy-transfer-proxy.conf;
    proxy_request_buffering off;
    proxy_buffering off;
  }

  location = /v1/updates/manifest {
    limit_req zone=rhzy_update_rate burst=5 nodelay;
    proxy_pass http://127.0.0.1:8001;
    include /etc/nginx/snippets/rhzy-transfer-proxy.conf;
  }

  location = /health {
    proxy_pass http://127.0.0.1:8001;
    include /etc/nginx/snippets/rhzy-transfer-proxy.conf;
  }

  location / {
    return 404;
  }
}
